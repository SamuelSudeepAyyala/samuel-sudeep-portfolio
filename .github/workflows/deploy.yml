name: Portfolio build and deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production portfolio
        run: npm run build -- --configuration production --base-href=/samuel-sudeep-portfolio/

      - name: Verify required public files and visual assets
        run: |
          set -euo pipefail
          ROOT=dist/samuel-sudeep-portfolio

          test -f "$ROOT/index.html"
          test -f "$ROOT/favicon.svg"
          test ! -f "$ROOT/favicon.ico"
          test -f "$ROOT/robots.txt"
          test -f "$ROOT/sitemap.xml"
          test -f "$ROOT/site.webmanifest"

          for file in theme.css theme-polish.css audit-polish.css now-polish.css project-tabs.css experience-polish.css regression-fixes.css theme.js; do
            test -f "$ROOT/$file"
            grep -q "$file" "$ROOT/index.html"
          done

          test -f "$ROOT/assets/profile.jpg"
          test -f "$ROOT/assets/Samuel_Sudeep_Ayyala_Resume.pdf"

          for icon in angular csharp dotnet fastapi githubactions grafana nextjs python react typescript; do
            test -f "$ROOT/assets/tech/$icon.svg"
          done

          grep -q 'favicon.svg' "$ROOT/index.html"
          grep -q 'site.webmanifest' "$ROOT/index.html"
          grep -q '"icons"' "$ROOT/site.webmanifest"
          grep -q 'favicon.svg' "$ROOT/site.webmanifest"

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: dist/samuel-sudeep-portfolio
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build
          path: dist/samuel-sudeep-portfolio

      - name: Deploy to gh-pages
        run: |
          npx --yes angular-cli-ghpages \
            --dir=dist/samuel-sudeep-portfolio \
            --repo=https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SamuelSudeepAyyala/samuel-sudeep-portfolio.git \
            --branch=gh-pages \
            --name="github-actions[bot]" \
            --email="41898282+github-actions[bot]@users.noreply.github.com" \
            --no-silent
