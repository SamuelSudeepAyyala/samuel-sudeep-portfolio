name: CI/CD for Angular App

on:
  push:
    branches:
      - main  # Trigger the workflow when code is pushed to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # You can change the Node.js version as needed

      - name: Install dependencies
        run: npm install

      - name: Build the Angular project
        run: npm run build -- --prod  # Build for production

      - name: Create Artifact for GitHub Pages
        run: |
          mkdir -p dist
          cp -r dist/samuel-sudeep-portfolio/* dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: github-pages
          path: dist/  # Upload dist folder as an artifact

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensure that the build job is successful before deploying
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Install angular-cli-ghpages
        run: npm install -g angular-cli-ghpages

      - name: Deploy to GitHub Pages
        run: |
          npx angular-cli-ghpages --dir=dist/samuel-sudeep-portfolio --repo=https://github.com/${{ github.repository }}.git
          # Deploy the app to GitHub Pages using the correct dist folder
