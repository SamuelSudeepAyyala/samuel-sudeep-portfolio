name: Portfolio build and deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production portfolio
        run: npm run build -- --configuration production --base-href=/samuel-sudeep-portfolio/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: dist/samuel-sudeep-portfolio
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build
          path: dist/samuel-sudeep-portfolio

      - name: Deploy to gh-pages
        run: |
          npx --yes angular-cli-ghpages \
            --dir=dist/samuel-sudeep-portfolio \
            --repo=https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SamuelSudeepAyyala/samuel-sudeep-portfolio.git \
            --branch=gh-pages \
            --name="github-actions[bot]" \
            --email="41898282+github-actions[bot]@users.noreply.github.com" \
            --no-silent
