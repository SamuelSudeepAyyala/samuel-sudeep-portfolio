name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # Trigger on push to the main branch (or your default branch)
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Specify the Node.js version you want to use

    - name: Install dependencies
      run: npm install

    - name: Build the project
      run: npm run build

    - name: Remove unnecessary files from dist folder
      run: |
        # For example, delete specific files or folders that aren't needed
        rm -rf ./dist/*.map  # Removes map files, if you don't need them
        rm -rf ./dist/*.log  # Removes log files, if they are present
        find ./dist -type l -exec rm -f {} \;  # Removes symlinks in the dist folder

    - name: Upload the build artifact
      uses: actions/upload-artifact@v4  # Using the stable version of the artifact action
      with:
        name: build-artifact
        path: ./dist  # Path to your build folder

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensure that the build step has completed before deploying
    if: github.event_name == 'push'  # Skip if triggered by a PR

    permissions:
      contents: write  # Required for GitHub Pages deployment
      id-token: write  # Required for ID token authentication
      pages: write  # Required for deploying to GitHub Pages

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      with:
         branch: main  # Push to the main branch
         folder: dist/samuel-sudeep-portfolio  # Make sure to replace this with the correct build output folder
         token: ${{ secrets.GITHUB_TOKEN }}
