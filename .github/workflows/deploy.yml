name: CI/CD for Angular App

on:
  push:
    branches:
      - master  # Trigger the workflow when code is pushed to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # You can change the Node.js version as needed

      - name: Install dependencies
        run: npm install

      - name: Build the Angular project
        run: npm run build -- --configuration production  # Build for production

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist/samuel-sudeep-portfolio  # Upload dist folder as an artifact

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensure that the build job is successful before deploying
    permissions:
      contents: write
      id-token: write 
      pages: write  

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: List contents of dist folder
        run: |
          echo "Listing the contents of the dist folder:"
          ls -alh

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install angular-cli-ghpages
        run: npm install -g angular-cli-ghpages

      - name: Deploy to GitHub Pages
        run: |
          npx angular-cli-ghpages --dir=./ --repo=https://github.com/${{ github.repository }}.git
