name: CI/CD for Angular App

on:
  push:
    branches:
      - master  # Trigger the workflow when code is pushed to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # You can change the Node.js version as needed

      - name: Install dependencies
        run: npm install

      - name: Build the Angular project
        run: npm run build -- --configuration production  # Build for production

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist/samuel-sudeep-portfolio  # Upload dist folder as an artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write 
      pages: write  

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./dist/samuel-sudeep-portfolio

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install
          npm install -g rimraf@6.0.1

      - name: Install angular-cli-ghpages
        run: npm install -g angular-cli-ghpages

      - name: Configure Git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: List contents of dist directory
        run: |
          echo "Listing the contents of the dist folder:"
          ls -alh ./dist/samuel-sudeep-portfolio

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git reset --hard origin/gh-pages

      - name: Deploy to GitHub Pages
        run: |
          npx angular-cli-ghpages --dir= dist/samuel-sudeep-portfolio --repo=https://github.com/${{ github.repository }}.git

      - name: Check Git status
        run: git status

