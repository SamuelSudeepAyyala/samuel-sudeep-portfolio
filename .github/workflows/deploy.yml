name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # Trigger on push to the main branch (or your default branch)
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Specify the Node.js version you want to use

    - name: Install dependencies
      run: npm install

    - name: Build the project
      run: npm run build

    - name: List files in the dist folder
      run: ls -alh  # Ensure that the dist folder has files

    - name: Remove unnecessary files from dist folder
      run: |
        # For example, delete specific files or folders that aren't needed
        rm -rf ./dist/samuel-sudeep-portfolio/*.map  # Removes map files, if you don't need them
        rm -rf ./dist/samuel-sudeep-portfolio/*.log  # Removes log files, if they are present
        find ./dist/samuel-sudeep-portfolio -type l -exec rm -f {} \;  # Removes symlinks in the dist folder

    - name: Upload the build artifact
      uses: actions/upload-artifact@v4  # Using the stable version of the artifact action
      with:
        name: github-pages  # Path to your build folder

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensure that the build step has completed before deploying

    permissions:
      contents: write  # Required for GitHub Pages deployment
      id-token: write  # Required for ID token authentication
      pages: write  # Required for deploying to GitHub Pages

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: github-pages  # Must match the name of the artifact uploaded

    - name: List files after downloading artifact
      run: ls -alh # Ensure that the files are extracted correctly

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
      with:
        artifact_name: github-pages
